<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Trading League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <span>👤 <span id="username">Trader</span></span>
            </div>
            <div class="stars-badge">
                ⭐ <span id="star-count">50</span> Stars
            </div>
        </header>

        <!-- Portfolio Overview -->
        <section class="portfolio-card">
            <p>PORTFOLIO VALUE</p>
            <h2>$10,450.00</h2>
            <span class="profit">+4.2% today</span>
        </section>

        <!-- Active Leagues -->
        <section class="leagues-section">
            <h3>ACTIVE LEAGUES</h3>
            <div class="league-item">
                <p><strong>Crypto Blitz League</strong> (Rank: #14)</p>
                <small>Prize Pool: 500 Stars | Time Left: 2h 45m</small>
            </div>
        </section>

        <!-- Quick Actions -->
        <section class="quick-actions">
            <button class="action-btn" onclick="joinLeague()">Join New League</button>
            <button class="action-btn" onclick="viewLeaderboard()">View Leaderboard</button>
        </section>

        <!-- Navigation Footer -->
        <nav class="footer-nav">
            <button class="nav-btn active">Home</button>
            <button class="nav-btn">Markets</button>
            <button class="nav-btn">Profile</button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
